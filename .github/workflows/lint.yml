# ============================================================
# .github/workflows/lint.yml
# Runs oxlint over site/js/, tests/ and scripts/ (config in
# .oxlintrc.json). Built WASM glue and the libs/ submodules are ignored.
# ============================================================

name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  oxlint:
    name: Lint (oxlint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint -- --deny-warnings
