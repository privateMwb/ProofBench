<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ProofBench: C++ libraries that prove their own claims. Run, benchmark and verify them live in the browser with WebAssembly.">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0D14"/>
      <stop offset="100%" stop-color="#17161F"/>
    </linearGradient>
    <linearGradient id="title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="50%" stop-color="#8D75FF"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="rule" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#8D75FF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowBg" cx="78%" cy="52%" r="38%">
      <stop offset="0%" stop-color="#8D75FF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#8D75FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset="60%" stop-color="#0E0D14" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0E0D14" stop-opacity="0.85"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#1D1C27"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#dots)"/>
  <rect width="1200" height="300" fill="url(#glowBg)"/>
  <rect width="1200" height="300" fill="url(#vignette)"/>

  <!-- Eyebrow: live status -->
  <circle cx="86" cy="86" r="4.5" fill="#8D75FF">
    <animate attributeName="opacity" values="1;0.25;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="102" y="90" font-family="'SF Mono','Cascadia Code',Consolas,'Courier New',monospace"
        font-size="12" letter-spacing="2.5" fill="#9A9AAA">RUN  ·  BENCHMARK  ·  VERIFY</text>

  <!-- Title -->
  <text x="80" y="170" font-family="'Segoe UI',Helvetica,Arial,sans-serif"
        font-size="84" font-weight="800" letter-spacing="-2" fill="url(#title)">ProofBench</text>
  <rect x="82" y="190" width="420" height="3" rx="1.5" fill="url(#rule)"/>

  <!-- Tagline -->
  <text x="82" y="228" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" fill="#C9C9D6">Libraries that prove their own claims.</text>
  <text x="82" y="256" font-family="'SF Mono','Cascadia Code',Consolas,'Courier New',monospace" font-size="13" letter-spacing="1" fill="#9A9AAA">C++23  →  WebAssembly  →  your browser</text>

  <!-- Claims being checked, one after another -->
  <text x="770" y="92" font-family="'SF Mono','Cascadia Code',Consolas,'Courier New',monospace"
        font-size="11" letter-spacing="2.5" fill="#9A9AAA">CLAIMS VERIFIED LIVE</text>
  <g>
    <rect x="770" y="96" width="350" height="34" rx="9" fill="#0E0D14" stroke="#2C2B38"/>
    <circle cx="794" cy="113" r="9" fill="none" stroke="#4CC27F" stroke-width="1.6" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.12;0.20;1" dur="6s" repeatCount="indefinite"/>
    </circle>
    <path d="M789.5 113 L793 116.5 L799 109" fill="none" stroke="#4CC27F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.12;0.20;1" dur="6s" repeatCount="indefinite"/>
    </path>
    <circle cx="794" cy="113" r="3" fill="#5C5C6E">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.12;0.20;1" dur="6s" repeatCount="indefinite"/>
    </circle>
    <text x="816" y="118" font-family="'SF Mono','Cascadia Code',Consolas,'Courier New',monospace" font-size="15" fill="#ECECF2">0 heap allocations in steady state</text>
  </g>
  <g>
    <rect x="770" y="140" width="350" height="34" rx="9" fill="#0E0D14" stroke="#2C2B38"/>
    <circle cx="794" cy="157" r="9" fill="none" stroke="#4CC27F" stroke-width="1.6" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.29;0.37;1" dur="6s" repeatCount="indefinite"/>
    </circle>
    <path d="M789.5 157 L793 160.5 L799 153" fill="none" stroke="#4CC27F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.29;0.37;1" dur="6s" repeatCount="indefinite"/>
    </path>
    <circle cx="794" cy="157" r="3" fill="#5C5C6E">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.29;0.37;1" dur="6s" repeatCount="indefinite"/>
    </circle>
    <text x="816" y="162" font-family="'SF Mono','Cascadia Code',Consolas,'Courier New',monospace" font-size="15" fill="#ECECF2">O(1) work per operation</text>
  </g>
  <g>
    <rect x="770" y="184" width="350" height="34" rx="9" fill="#0E0D14" stroke="#2C2B38"/>
    <circle cx="794" cy="201" r="9" fill="none" stroke="#4CC27F" stroke-width="1.6" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.46;0.54;1" dur="6s" repeatCount="indefinite"/>
    </circle>
    <path d="M789.5 201 L793 204.5 L799 197" fill="none" stroke="#4CC27F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.46;0.54;1" dur="6s" repeatCount="indefinite"/>
    </path>
    <circle cx="794" cy="201" r="3" fill="#5C5C6E">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.46;0.54;1" dur="6s" repeatCount="indefinite"/>
    </circle>
    <text x="816" y="206" font-family="'SF Mono','Cascadia Code',Consolas,'Courier New',monospace" font-size="15" fill="#ECECF2">strong exception guarantee</text>
  </g>
  <g>
    <rect x="770" y="228" width="350" height="34" rx="9" fill="#0E0D14" stroke="#2C2B38"/>
    <circle cx="794" cy="245" r="9" fill="none" stroke="#4CC27F" stroke-width="1.6" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.63;0.71;1" dur="6s" repeatCount="indefinite"/>
    </circle>
    <path d="M789.5 245 L793 248.5 L799 241" fill="none" stroke="#4CC27F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.63;0.71;1" dur="6s" repeatCount="indefinite"/>
    </path>
    <circle cx="794" cy="245" r="3" fill="#5C5C6E">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.63;0.71;1" dur="6s" repeatCount="indefinite"/>
    </circle>
    <text x="816" y="250" font-family="'SF Mono','Cascadia Code',Consolas,'Courier New',monospace" font-size="15" fill="#ECECF2">exact hit and miss counts</text>
  </g>
</svg>
