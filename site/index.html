<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ProofBench</title>
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; max-width: 40rem; margin: 3rem auto; padding: 0 1rem; }
    code, output { font-family: ui-monospace, monospace; }
    input { width: 5rem; }
    .ok { color: green; } .bad { color: crimson; }
  </style>
</head>
<body>
  <h1>ProofBench</h1>
  <p>Phase 1: C++ → WebAssembly → browser.</p>
  <p id="status">Loading WASM…</p>
  <p><input id="a" type="number" value="2"> + <input id="b" type="number" value="3">
     = <output id="sum">?</output></p>
  <p>fib(<input id="n" type="number" value="50">) = <output id="fib">?</output></p>
  <p>Compiled as C++ standard <output id="std">?</output></p>

  <script type="module">
    import create_hello from './wasm/hello.js';
    const status = document.getElementById('status');
    try {
      const m = await create_hello();
      const add = m.cwrap('add', 'number', ['number', 'number']);
      const fib = m.cwrap('fib', 'bigint', ['number']);
      const std = m.cwrap('cpp_standard', 'number', []);
      const $ = id => document.getElementById(id);
      const update = () => {
        $('sum').textContent = add(+$('a').value, +$('b').value);
        $('fib').textContent = fib(+$('n').value).toString();
      };
      for (const id of ['a', 'b', 'n']) $(id).addEventListener('input', update);
      $('std').textContent = std();
      update();
      status.textContent = 'WASM loaded.';
      status.className = 'ok';
    } catch (e) {
      status.textContent = 'Failed to load WASM: ' + e.message + ' (did you run scripts/build.ps1?)';
      status.className = 'bad';
    }
  </script>
</body>
</html>
